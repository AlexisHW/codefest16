apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argoapps
  namespace: argocd
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: default
  source:
    directory:
      recurse: true
    path: argoapps/kube01002/
    repoURL: https://codefest.example/ecom/helm-infra.git
    targetRevision: master
  syncPolicy:
    automated: {}
