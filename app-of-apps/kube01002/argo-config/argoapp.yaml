apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-config
  namespace: argocd
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: argocd
  source:
    helm:
      valueFiles:
        - values.yaml
        - clusters/kube01002/common.yaml
        - clusters/kube01002/is.yaml
        - clusters/kube01002/rbac.yaml
    path: .
    repoURL: https://codefest.example/cd-tools/argo-config.git
    targetRevision: master
  syncPolicy:
    automated:
      selfHeal: true
