apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql-haproxy
  namespace: argocd
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: postgresql-haproxy
  source:
    path: postgresql-haproxy/argo-apps/development/p01/kube01001
    repoURL: https://codefest.example/cd-tools/helm-infra.git
    targetRevision: master
  syncPolicy:
    automated:
      selfHeal: true
