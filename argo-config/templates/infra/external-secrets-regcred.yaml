{{- $values := .Values -}}
{{- if $values.regcred_infra_vault_path }}
{{- range $key, $val := .Values.fest_infra }}
{{- if not (or $val.disableESO $val.disableRegcred) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: regcred-{{ $key }}
  namespace: {{ $key }}
spec:
  secretStoreRef:
    kind: SecretStore
    name: {{ $key }}-secret-store
  target:
    name: regcred
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ `{{ .dockerconfigjson }}` }}"
  dataFrom:
    - extract:
        key: {{ $values.regcred_infra_vault_path }}
{{- end }}
{{- end }}
{{- end }}
