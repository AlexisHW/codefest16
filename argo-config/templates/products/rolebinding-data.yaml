{{- range $k, $v := .Values.fest_products }}
{{- if $v.data }}
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $k }}-pod-manager-{{ $k }}-af-sa
  namespace: {{ $k }}{{ $.Values.namespace_postfix | default "" }}
subjects:
  - kind: ServiceAccount
    name: {{ $k }}-spark-sa
    namespace: {{ $k }}{{ $.Values.namespace_postfix | default "" }}
roleRef:
  kind: Role
  name: {{ $k }}-pod-manager
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
