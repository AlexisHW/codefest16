{{- range $key, $val := .Values.fest_products }}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ $key }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  sourceRepos:
    - '*'
  destinations:
    - namespace: '*'
      server: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: PersistentVolume
{{- if $val.clusterResourceWhitelist }}
{{- $val.clusterResourceWhitelist | toYaml | nindent 4 }}
{{- end }}
{{- end }}
